[tools]
python = "3.12"
uv = "latest"
node = "22"

[env]
_.python.venv = { path = ".venv", create = true }
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install Python and npm dependencies."
run = [
  "uv sync",
  "npm install",
  "uv run pre-commit install"
]

[tasks.sass_build]
description = "Compile SCSS to CSS using local npm sass."
depends = ["install"]
run = "sass app/scss/style.scss app/scss/style.css"

[tasks.sass_watch]
description = "Watch and compile SCSS to CSS using local npm sass."
depends = ["install"]
run = "sass --watch app/scss/style.scss:app/scss/style.css"

[tasks.serve_simple]
description = "Serve the site locally with Python's built-in static server on http://localhost:8000."
run = "uv run python -m http.server 8000"
