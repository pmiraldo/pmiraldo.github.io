minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: prettier-js
        name: prettier-js
        language: system
        entry: ./node_modules/.bin/prettier --write --tab-width 2 --use-tabs false
        files: ^app/js/.*\.js$
      - id: prettier-html
        name: prettier-html
        language: system
        entry: ./node_modules/.bin/prettier --write --tab-width 2 --use-tabs false
        files: \.html$
      - id: eslint-js
        name: eslint-js
        language: system
        entry: ./node_modules/.bin/eslint --max-warnings=0
        files: ^app/js/.*\.js$
      - id: htmlhint
        name: htmlhint
        language: system
        entry: ./node_modules/.bin/htmlhint --config .htmlhintrc
        files: \.html$
      - id: sass-generated-assets
        name: sass-generated-assets
        language: system
        entry: /bin/bash -lc 'npm run sass:build && git diff --exit-code -- app/scss/style.css app/scss/style.css.map'
        pass_filenames: false
        always_run: true
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
